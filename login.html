<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Acesso Seguro · Dra. Silvia Oliveira Nutricionista</title>
<meta name="kos-auth-level" content="guest-only">
<script src="assets/js/auth-guard.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root, [data-theme="light"] {
  --bg-deep: #f8fafc;
  --bg-card: #ffffff;
  --text-primary: #334155;
  --text-title: #0f172a;
  --text-muted: #64748b;
  --border-forest: #e2e8f0;
  --sage-light: #203528;
  --sage-accent: #16a34a;
  --sage-dim: #f0fdf4;
  --input-bg: #f8fafc;
  --tr: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 20px;
}

[data-theme="dark"] {
  --bg-deep: #09130b;
  --bg-card: #122116;
  --text-primary: #e2e8f0;
  --text-title: #ffffff;
  --text-muted: #8ea488;
  --border-forest: rgba(140, 164, 129, 0.22);
  --sage-light: #8ca481;
  --sage-accent: #34d399;
  --sage-dim: rgba(140, 164, 129, 0.15);
  --input-bg: rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

/* DECORAÇÃO DE FUNDO BOTÂNICA */
.bg-glow {
  position: absolute; width: 450px; height: 450px;
  background: radial-gradient(circle, rgba(32, 53, 40, 0.08) 0%, rgba(0,0,0,0) 70%);
  top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
}

/* CARTÃO CENTRAL DE LOGIN */
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border-forest);
  border-radius: var(--radius);
  padding: 40px 34px;
  width: 100%;
  max-width: 430px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  gap: 22px;
  position: relative;
  z-index: 10;
}

.brand-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.brand-logo {
  width: 58px; height: 58px;
  border-radius: 16px;
  background: #203528;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(32, 53, 40, 0.2);
}
.brand-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--text-title); margin-top: 2px; }
.brand-sub { font-size: 0.74rem; color: #16a34a; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 0.76rem; font-weight: 800; text-transform: uppercase; color: #475569; letter-spacing: 0.05em; }
.form-control {
  background: var(--input-bg); border: 1px solid var(--border-forest);
  padding: 12px 16px; border-radius: 10px; color: var(--text-title);
  font-family: inherit; font-size: 0.92rem; outline: none; transition: var(--tr); width: 100%;
}
.form-control:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12); }

.btn-submit {
  background: #203528; color: #ffffff; border: none;
  padding: 14px; border-radius: 10px; font-family: inherit; font-weight: 800;
  font-size: 0.92rem; cursor: pointer; transition: var(--tr); width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
  box-shadow: 0 4px 14px rgba(32, 53, 40, 0.2);
}
.btn-submit:hover { background: #16261d; transform: translateY(-1px); }

.footer-links { text-align: center; display: flex; flex-direction: column; gap: 10px; font-size: 0.82rem; color: var(--text-muted); }
.footer-links a { color: #16a34a; text-decoration: none; font-weight: 700; transition: var(--tr); }
.footer-links a:hover { text-decoration: underline; }

.status-msg {
  padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; text-align: center; display: none; font-weight: 700;
}
.status-msg.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
.status-msg.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

@media (max-width: 480px) {
  body { padding: 16px 12px; }
  .login-card { padding: 28px 20px; border-radius: 16px; }
  .brand-title { font-size: 1.3rem; }
  .form-control { font-size: 16px !important; }
}
</style>
<link rel="stylesheet" href="assets/css/mobile-base.css">
</head>
<body>

<div class="bg-glow"></div>

<main class="login-card">
  <div class="brand-header">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="50" r="48" fill="#203528" stroke="#8ca481" stroke-width="3"/>
        <path d="M 50 18 Q 72 40 50 82 Q 28 40 50 18 Z" fill="#8ca481" />
        <path d="M 50 18 L 50 82" stroke="#203528" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 50 42 Q 62 34 68 32" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M 50 55 Q 38 47 32 45" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
        <circle cx="68" cy="32" r="2.5" fill="#203528" />
        <circle cx="32" cy="45" r="2.5" fill="#203528" />
      </svg>
    </div>
    <div>
      <div class="brand-title">Dra. Silvia Oliveira</div>
      <div class="brand-sub">Nutricionista Clínica</div>
    </div>
  </div>

  <div id="statusBox" class="status-msg"></div>

  <!-- FORMULÁRIO DE LOGIN ÚNICO UNIFICADO -->
  <form onsubmit="handleUnifiedLogin(event)" style="display: flex; flex-direction: column; gap: 16px;">
    <div class="form-group">
      <label>CPF ou E-mail Cadastrado</label>
      <input type="text" id="userInput" class="form-control" placeholder="000.000.000-00 ou seu@email.com" required>
    </div>

    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Senha de Acesso</label>
        <a href="#" onclick="abrirModalEsqueciSenha(event)" style="font-size:0.75rem; color:#16a34a; text-decoration:none; font-weight:700;">Esqueci minha senha</a>
      </div>
      <div style="position:relative; width:100%;">
        <input type="password" id="passInput" class="form-control" placeholder="Digite sua senha" required style="padding-right:45px;">
        <button type="button" onclick="togglePassVisibility()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#64748b; font-size:1.1rem; cursor:pointer; padding:4px;">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn-submit">
      🔑 Entrar no Sistema
    </button>
  </form>

  <div class="footer-links">
    <div>
      <a href="index.html">🌐 Voltar ao Site Principal</a>
    </div>
  </div>
</main>

<!-- MODAL DE RECUPERAÇÃO DE SENHA -->
<div id="modalEsqueciSenha" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
  <div style="background:var(--bg-card); border:1px solid var(--border-forest); border-radius:16px; padding:24px; width:100%; max-width:420px; box-shadow:0 20px 40px rgba(0,0,0,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-forest); padding-bottom:12px; margin-bottom:14px;">
      <div style="font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; color:var(--text-title);">🔑 Recuperar Senha / PIN</div>
      <button onclick="fecharModalEsqueciSenha()" style="background:transparent; border:none; color:var(--text-muted); font-size:1.3rem; cursor:pointer;">✕</button>
    </div>

    <p style="font-size:0.84rem; color:var(--text-muted); line-height:1.5; margin-bottom:14px;">
      Informe seu <strong>CPF ou E-mail</strong> cadastrado. Se o cadastro constar em nosso sistema, enviaremos as instruções de acesso para sua caixa de entrada.
    </p>

    <form onsubmit="solicitarRecuperacao(event)" style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-group">
        <label style="font-size:0.75rem; font-weight:800; color:#166534; text-transform:uppercase;">CPF ou E-mail</label>
        <input type="text" id="reqIdInput" class="form-control" placeholder="000.000.000-00 ou seu@email.com" required>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:6px; padding-top:12px; border-top:1px solid var(--border-forest);">
        <button type="button" class="btn-submit" style="background:transparent; border:1px solid var(--border-forest); color:var(--text-muted); width:auto;" onclick="fecharModalEsqueciSenha()">Cancelar</button>
        <button type="submit" class="btn-submit" id="btnEnviarRecuperacao" style="width:auto;">📧 Enviar Instruções</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxs015dDanZXqKFpwehVTKPrzEBBMSJ_IZIgfuUlTKbVACd-a7-ffF0S9izs3XUK6Gh/exec";

function maskCPF(v) {
  return String(v || '').replace(/\D/g, '')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2')
    .slice(0, 14);
}

function togglePassVisibility() {
  const inp = document.getElementById('passInput');
  if (inp) {
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('kos_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);

  const inp = document.getElementById('userInput');
  if (inp) {
    inp.addEventListener('input', (e) => {
      const v = e.target.value;
      if (/^[\d.-]+$/.test(v)) {
        e.target.value = maskCPF(v);
      }
    });
  }
});

function showStatus(msg, type = 'error') {
  const statusBox = document.getElementById('statusBox');
  if (statusBox) {
    statusBox.innerText = msg;
    statusBox.className = `status-msg ${type}`;
    statusBox.style.display = 'block';
  }
}

async function apiCall(action, payload = {}) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    return await res.json();
  } catch (err) {
    console.error("Erro na requisição API:", err);
    return { success: false, error: "Falha de conexão com o servidor." };
  }
}

async function handleUnifiedLogin(e) {
  e.preventDefault();
  const identifierInput = document.getElementById('userInput').value.trim();
  const passwordInput = document.getElementById('passInput').value.trim();

  if (!identifierInput || !passwordInput) {
    showStatus("Por favor, informe seu CPF/E-mail e senha de acesso.");
    return;
  }

  showStatus("Autenticando no banco de dados...", "success");

  const res = await apiCall('loginUsuario', { identifierInput, passwordInput });

  if (res && res.success && res.data) {
    const user = res.data;
    const redirectUrl = new URLSearchParams(window.location.search).get('redirect');

    if (user.tipo === 'ADMIN') {
      sessionStorage.setItem('kos_adm_auth', 'true');
      sessionStorage.setItem('kos_user_dados', JSON.stringify(user));
      showStatus(`✅ Bem-vinda, ${user.nome}! Entrando no Painel...`, "success");
      setTimeout(() => {
        window.location.href = redirectUrl || "app-nutri.html";
      }, 600);
    } else {
      sessionStorage.setItem('kos_paciente_auth', 'true');
      sessionStorage.setItem('kos_paciente_dados', JSON.stringify(user));
      showStatus(`✅ Bem-vindo(a), ${user.nome}! Entrando no Portal...`, "success");
      setTimeout(() => {
        window.location.href = redirectUrl || "portal-paciente.html";
      }, 600);
    }
  } else {
    showStatus(res.error || "CPF/E-mail ou Senha incorreta. Tente novamente.");
  }
}

function abrirModalEsqueciSenha(e) {
  if (e) e.preventDefault();
  const m = document.getElementById('modalEsqueciSenha');
  if (m) m.style.display = 'flex';
}

function fecharModalEsqueciSenha() {
  const m = document.getElementById('modalEsqueciSenha');
  if (m) m.style.display = 'none';
  const inp = document.getElementById('reqIdInput');
  if (inp) inp.value = '';
}

async function solicitarRecuperacao(e) {
  e.preventDefault();
  const idVal = document.getElementById('reqIdInput').value.trim();
  const btn = document.getElementById('btnEnviarRecuperacao');

  if (!idVal) {
    alert("Por favor, informe seu CPF ou E-mail.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "🟡 Enviando e-mail...";

  const res = await apiCall('recuperarSenha', { identifier: idVal });

  btn.disabled = false;
  btn.innerText = "📧 Enviar Instruções";

  fecharModalEsqueciSenha();

  if (res && res.success) {
    const msg = (res.data && res.data.message) || res.message || "Solicitação enviada. Verifique sua caixa de e-mail.";
    showStatus("📧 " + msg, "success");
  } else {
    const errorMsg = (res && res.data && res.data.error) || (res && res.error) || "Erro ao solicitar recuperação.";
    showStatus("⚠️ " + errorMsg, "error");
  }
}
</script>
</body>
</html>
