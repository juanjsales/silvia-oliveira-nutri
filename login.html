<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login Unificado · Dra. Silvia Lemos Nutricionista</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root, [data-theme="dark"] {
  --bg-deep: #0e1a12;
  --bg-card: #182a1f;
  --bg-header: #203528;
  --text-primary: #eef4e5;
  --text-title: #ffffff;
  --text-muted: #a0b399;
  --border-forest: rgba(140, 164, 129, 0.25);
  --sage-light: #8ca481;
  --sage-dim: rgba(140, 164, 129, 0.2);
  --input-bg: rgba(0, 0, 0, 0.4);
  --tr: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 24px;
}

[data-theme="light"] {
  --bg-deep: #f3f6f1;
  --bg-card: #ffffff;
  --bg-header: #e6ede0;
  --text-primary: #1c2e22;
  --text-title: #142419;
  --text-muted: #57695b;
  --border-forest: #d1ded0;
  --sage-light: #486640;
  --sage-dim: rgba(72, 102, 64, 0.12);
  --input-bg: #f8faf6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

.login-card { background: var(--bg-card); border-color: var(--border-forest); }
.brand-title { color: var(--text-title); }

/* DECORAÇÃO DE FUNDO BOTÂNICA */
.bg-glow {
  position: absolute; width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(140, 164, 129, 0.15) 0%, rgba(14, 26, 18, 0) 70%);
  top: 10%; left: 50%; transform: translateX(-50%); pointer-events: none;
}

/* CARTÃO CENTRAL DE LOGIN */
.login-card {
  background: var(--forest-card);
  border: 1.5px solid var(--border-forest);
  border-radius: var(--radius);
  padding: 40px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  z-index: 10;
}

.brand-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.brand-logo {
  width: 64px; height: 64px;
  background: var(--sage-dim); border: 1.5px solid var(--sage-light);
  border-radius: 50%; font-size: 1.8rem;
  display: flex; align-items: center; justify-content: center;
}
.brand-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: #fff; }
.brand-sub { font-size: 0.8rem; color: var(--sage-light); font-weight: 700; letter-spacing: 0.05em; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--sage-light); letter-spacing: 0.05em; }
.form-control {
  background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-forest);
  padding: 14px 18px; border-radius: 12px; color: #fff;
  font-family: inherit; font-size: 0.95rem; outline: none; transition: var(--tr); width: 100%;
}
.form-control:focus { border-color: var(--sage-light); box-shadow: 0 0 0 3px rgba(140, 164, 129, 0.15); }

.btn-submit {
  background: var(--sage-light); color: var(--forest-dark); border: none;
  padding: 15px; border-radius: 12px; font-family: inherit; font-weight: 900;
  font-size: 0.95rem; cursor: pointer; transition: var(--tr); width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
}
.btn-submit:hover { background: #9bb590; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(140, 164, 129, 0.35); }

.footer-links { text-align: center; display: flex; flex-direction: column; gap: 10px; font-size: 0.82rem; color: var(--text-muted); }
.footer-links a { color: var(--sage-light); text-decoration: none; font-weight: 700; transition: var(--tr); }
.footer-links a:hover { color: #fff; }

.status-msg {
  padding: 12px; border-radius: 10px; font-size: 0.82rem; text-align: center; display: none; font-weight: 700;
}
.status-msg.error { background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.3); color: #f87171; }
.status-msg.success { background: rgba(140, 164, 129, 0.15); border: 1px solid var(--sage-light); color: #eef4e5; }
</style>
</head>
<body>

<div class="bg-glow"></div>

<main class="login-card">
  <div class="brand-header">
    <div class="brand-logo">🌿</div>
    <div>
      <div class="brand-title">Dra. Silvia Lemos</div>
      <div class="brand-sub">NUTRICIONISTA · CRN-4 25104731</div>
    </div>
  </div>

  <div id="statusBox" class="status-msg"></div>

  <!-- FORMULÁRIO DE LOGIN ÚNICO UNIFICADO -->
  <form onsubmit="handleUnifiedLogin(event)" style="display: flex; flex-direction: column; gap: 16px;">
    <div class="form-group">
      <label>CPF ou E-mail de Acesso</label>
      <input type="text" id="userInput" class="form-control" placeholder="000.000.000-00 ou email@exemplo.com" required>
    </div>

    <div class="form-group">
      <label>Sua Senha ou PIN</label>
      <input type="password" id="passInput" class="form-control" placeholder="Digite sua senha de acesso" required>
    </div>

    <button type="submit" class="btn-submit">
      🔑 Entrar no Sistema
    </button>
  </form>

  <div class="footer-links">
    <div>
      Ainda não tem atendimento?
      <a href="anamnese-publica.html">Preencha sua Anamnese Pré-Consulta 📋</a>
    </div>
    <div style="margin-top: 4px;">
      <a href="index.html">🌐 Voltar ao Site Principal</a>
    </div>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxs015dDanZXqKFpwehVTKPrzEBBMSJ_IZIgfuUlTKbVACd-a7-ffF0S9izs3XUK6Gh/exec";

function maskCPF(v) {
  return String(v || '').replace(/\D/g, '')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2')
    .slice(0, 14);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('kos_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  const inp = document.getElementById('userInput');
  if (inp) {
    inp.addEventListener('input', (e) => {
      const v = e.target.value;
      if (/^[\d.-]+$/.test(v)) {
        e.target.value = maskCPF(v);
      }
    });
  }
});

function showStatus(msg, type = 'error') {
  const statusBox = document.getElementById('statusBox');
  if (statusBox) {
    statusBox.innerText = msg;
    statusBox.className = `status-msg ${type}`;
    statusBox.style.display = 'block';
  }
}

async function apiCall(action, payload = {}) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    return await res.json();
  } catch (err) {
    console.error("Erro na requisição API:", err);
    return { success: false, error: "Falha de conexão com o servidor." };
  }
}

async function handleUnifiedLogin(e) {
  e.preventDefault();
  const identifierInput = document.getElementById('userInput').value.trim();
  const passwordInput = document.getElementById('passInput').value.trim();

  if (!identifierInput || !passwordInput) {
    showStatus("Por favor, informe seu CPF/E-mail e senha de acesso.");
    return;
  }

  showStatus("Autenticando no banco de dados...", "success");

  // Chamada à API unificada loginUsuario
  const res = await apiCall('loginUsuario', { identifierInput, passwordInput });

  if (res && res.success && res.data) {
    const user = res.data;
    const userTipo = (user.tipo || "PACIENTE").toUpperCase();

    if (userTipo === 'ADMIN') {
      sessionStorage.setItem('kos_adm_auth', 'true');
      sessionStorage.setItem('kos_user_dados', JSON.stringify(user));
      showStatus(`✅ Bem-vinda, ${user.nome}! Entrando no Painel...`, "success");
      setTimeout(() => {
        window.location.href = "app-nutri.html";
      }, 600);
    } else {
      sessionStorage.setItem('kos_paciente_auth', 'true');
      sessionStorage.setItem('kos_paciente_dados', JSON.stringify(user));
      showStatus(`✅ Bem-vindo(a), ${user.nome}! Entrando no Portal...`, "success");
      setTimeout(() => {
        window.location.href = "portal-paciente.html";
      }, 600);
    }
  } else {
    // Fallback de segurança local para Dra. Silvia
    if (identifierInput.toLowerCase() === "silviadeoliveira24.nutri@gmail.com" && passwordInput === "silvia2026") {
      sessionStorage.setItem('kos_adm_auth', 'true');
      showStatus("✅ Acesso Autorizado! Entrando no Painel...", "success");
      setTimeout(() => {
        window.location.href = "app-nutri.html";
      }, 600);
    } else {
      showStatus(res.error || "CPF/E-mail ou Senha incorreta. Tente novamente.");
    }
  }
}
</script>
</body>
</html>
