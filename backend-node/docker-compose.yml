services:
# Apenas alternativa de desenvolvimento offline. Produção e homologação usam Supabase.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nutricionista
      POSTGRES_USER: nutricionista
      POSTGRES_PASSWORD: desenvolvimento_local
    ports:
      - "5432:5432"
    volumes:
      - nutricionista_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutricionista -d nutricionista"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nutricionista_postgres:
