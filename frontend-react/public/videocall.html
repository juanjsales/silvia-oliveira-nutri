<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleconsulta Nutricional · Dra. Silvia Oliveira Lemos</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #070d09;
            --bg-card: #0e1a12;
            --bg-header: #122218;
            --forest-deep: #162b1e;
            --sage-accent: #8ca481;
            --sage-glow: #34d399;
            --text-title: #ffffff;
            --text-body: #e4ebe1;
            --text-muted: #9ab390;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-body);
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── HEADER ── */
        .call-header {
            background: var(--bg-header);
            border-bottom: 1px solid rgba(140, 164, 129, 0.2);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            flex-shrink: 0;
            z-index: 50;
        }

        .call-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(140, 164, 129, 0.15);
            border: 1px solid rgba(140, 164, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sage-glow);
            flex-shrink: 0;
        }

        .call-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
        }

        .call-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--sage-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(140, 164, 129, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(140, 164, 129, 0.2);
        }

        .call-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fbbf24;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .call-status.connected {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.4);
            color: #34d399;
        }

        .call-timer {
            font-family: monospace;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--sage-accent);
            background: rgba(140, 164, 129, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(140, 164, 129, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .call-schedule-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 800;
            color: #d1fae5;
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        /* ── VIDEO STAGE ── */
        .stage-container {
            flex: 1;
            position: relative;
            background: #040805;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* ── CONTAINER PRINCIPAL DOS VÍDEOS ── */
        .videos-layout-grid {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* MODO 1: DESTAQUE (Principal + Miniatura PiP) */
        .videos-layout-grid.mode-spotlight {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .videos-layout-grid.mode-spotlight .remote-video-wrap {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #040805;
            z-index: 1;
        }

        .videos-layout-grid.mode-spotlight .local-video-wrap {
            position: absolute;
            bottom: 84px;
            right: 20px;
            width: clamp(140px, 22vw, 220px);
            aspect-ratio: 16 / 9;
            height: auto;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(140, 164, 129, 0.5);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            background: #0d1710;
            z-index: 25;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .videos-layout-grid.mode-spotlight .local-video-wrap:hover {
            transform: scale(1.04);
            border-color: var(--sage-glow);
        }

        /* MODO 2: LADO A LADO / GRID (Proporções Perfeitas) */
        .videos-layout-grid.mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            padding-bottom: 82px;
            width: 100%;
            height: 100%;
            align-items: stretch;
        }

        .videos-layout-grid.mode-grid .remote-video-wrap,
        .videos-layout-grid.mode-grid .local-video-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #08120a;
            border: 1.5px solid rgba(140, 164, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            bottom: auto;
            right: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* MODO 3: PRÉVIA LOCAL (Enquanto aguarda a outra pessoa) */
        .videos-layout-grid.mode-waiting .remote-video-wrap {
            display: none;
        }

        .videos-layout-grid.mode-waiting .local-video-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
            z-index: 5;
        }

        /* ── ELEMENTOS DE VÍDEO (100% VISÍVEL E SEM CORTES POR PADRÃO) ── */
        .video-element,
        #remoteVideo,
        #localVideo {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain !important; /* Padrão: 100% da pessoa visível sem achatar nem cortar */
            background: #040805;
            transition: object-fit 0.2s ease;
            display: block;
            margin: auto;
        }

        /* Na miniatura PiP própria, usar cover para preencher o cartão */
        .mode-spotlight .local-video-wrap .video-element,
        .mode-spotlight .local-video-wrap #localVideo {
            object-fit: cover !important;
        }

        /* Modo Preencher Tela (se o usuário clicar no botão de enquadramento) */
        .stage-container.fit-cover .video-element,
        .stage-container.fit-cover #remoteVideo {
            object-fit: cover !important;
        }

        #localVideo {
            transform: scaleX(-1); /* espelha câmera própria */
        }

        /* Se for compartilhamento de tela, sempre manter 100% legível */
        .screen-sharing-active #remoteVideo,
        .screen-sharing-active #localVideo {
            object-fit: contain !important;
            transform: none !important;
        }

        @media (max-width: 720px), (max-aspect-ratio: 1/1) {
            .videos-layout-grid.mode-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 8px;
                padding: 8px;
                padding-bottom: 76px;
            }

            .videos-layout-grid.mode-spotlight .local-video-wrap {
                bottom: 74px;
                right: 12px;
                width: 130px;
            }
        }

        .waiting-status-banner {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 26, 18, 0.88);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--sage-accent);
            padding: 10px 22px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeInDown 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .waiting-status-banner .pulse-dot-large {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--sage-glow);
            box-shadow: 0 0 10px var(--sage-glow);
            animation: pulse-ring 1.8s infinite;
        }

        .waiting-status-banner strong {
            font-size: 0.86rem;
            color: #ffffff;
        }

        .waiting-status-banner small {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            color: #ffffff;
            backdrop-filter: blur(8px);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
        }

        /* ── FLOATING CONTROLS ── */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(14, 26, 18, 0.92);
            backdrop-filter: blur(18px);
            border: 1.5px solid rgba(140, 164, 129, 0.35);
            padding: 8px 18px;
            border-radius: 36px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
            z-index: 40;
        }

        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid rgba(140, 164, 129, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ctrl-btn svg {
            width: 19px;
            height: 19px;
            stroke-width: 2;
            transition: transform 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(140, 164, 129, 0.3);
            border-color: var(--sage-accent);
            transform: translateY(-2px);
        }

        .ctrl-btn.active {
            background: var(--sage-glow) !important;
            color: #070d09 !important;
            border-color: var(--sage-glow) !important;
        }

        .ctrl-btn.off {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.75);
            color: #fca5a5;
        }

        .ctrl-btn.btn-hangup {
            background: var(--danger);
            border-color: var(--danger);
            color: #ffffff;
            width: 48px;
            height: 48px;
            margin-left: 4px;
        }

        .ctrl-btn.btn-hangup:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
            transform: translateY(-2px) scale(1.06);
        }

        /* ── TOAST NOTIFICATIONS ── */
        .toast-msg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 26, 18, 0.94);
            border: 1px solid var(--sage-accent);
            color: #e4ebe1;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 700;
            z-index: 50;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7);
            display: none;
            backdrop-filter: blur(12px);
            animation: slide-toast 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-toast {
            from { transform: translate(-50%, -12px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .videos-layout-grid.mode-grid {
                flex-direction: column;
                padding-bottom: 74px;
            }
            .videos-layout-grid.mode-grid .remote-video-wrap,
            .videos-layout-grid.mode-grid .local-video-wrap {
                width: 100%;
                height: 50%;
            }
            .videos-layout-grid.mode-spotlight .local-video-wrap {
                width: 120px;
                height: 90px;
                bottom: 78px;
                right: 12px;
            }
            .controls-bar { gap: 6px; padding: 6px 12px; bottom: 12px; }
            .ctrl-btn { width: 38px; height: 38px; }
            .ctrl-btn svg { width: 16px; height: 16px; }
            .ctrl-btn.btn-hangup { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="call-header" id="callHeader">
        <div class="call-brand">
            <div class="brand-icon-wrap" title="Dra. Silvia Oliveira Lemos" style="width:34px; height:34px; border-radius:50%; overflow:hidden; border:none; padding:0; background:transparent; display:flex; align-items:center; justify-content:center;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="50" cy="50" r="48" fill="#203528" stroke="#8ca481" stroke-width="3"/>
                    <path d="M 50 18 Q 72 40 50 82 Q 28 40 50 18 Z" fill="#8ca481" />
                    <path d="M 50 18 L 50 82" stroke="#203528" stroke-width="2.5" stroke-linecap="round" />
                    <path d="M 50 42 Q 62 34 68 32" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
                    <path d="M 50 55 Q 38 47 32 45" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
                    <circle cx="68" cy="32" r="2.5" fill="#203528" />
                    <circle cx="32" cy="45" r="2.5" fill="#203528" />
                </svg>
            </div>
            <div>
                <div class="call-title" id="headerTitle">Teleconsulta Nutricional</div>
                <div style="font-size:0.7rem; color:var(--text-muted)" id="headerSub">Dra. Silvia Oliveira Lemos · CRN-1 12345</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px">
            <div class="call-schedule-pill" id="callSchedulePill" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="scheduleText"></span>
            </div>
            <span class="call-security-badge" title="Conexão direta ponta a ponta criptografada">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                P2P Seguro
            </span>
            <span class="call-status" id="callStatus">
                <span class="status-dot"></span>
                <span>Iniciando câmera...</span>
            </span>
            <div class="call-timer" id="callTimer">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="timerText">00:00</span>
            </div>
        </div>
    </header>

    <!-- PALCO DE VÍDEO -->
    <main class="stage-container" id="stageContainer">
        <div id="toastMsg" class="toast-msg"></div>

        <!-- BANNER DE STATUS DE ESPERA -->
        <div class="waiting-status-banner" id="waitingBanner">
            <div class="pulse-dot-large"></div>
            <div>
                <strong id="waitingTitle">Sua câmera está pronta</strong>
                <small id="waitingDesc">Aguardando o participante conectar à sala...</small>
            </div>
        </div>

        <!-- LAYOUT DE VÍDEOS (INICIA EM MODO ESPERA/PREVIEW) -->
        <div class="videos-layout-grid mode-waiting" id="videosLayout">
            <!-- VÍDEO REMOTO (OUTRA PESSOA) -->
            <div class="remote-video-wrap" id="remoteVideoBox">
                <video id="remoteVideo" class="video-element" autoplay playsinline></video>
                <div class="video-label" id="remoteLabel">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="remoteNameText">Paciente</span>
                </div>
            </div>

            <!-- VÍDEO LOCAL (SUA CÂMERA) -->
            <div class="local-video-wrap" id="localVideoBox" title="Clique para alternar destaque">
                <video id="localVideo" class="video-element" autoplay playsinline muted></video>
                <div class="video-label" id="localLabel">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="localNameText">Você</span>
                </div>
            </div>
        </div>

        <!-- CONTROLES FLUTUANTES -->
        <div class="controls-bar">
            <!-- BOTÃO MICROFONE -->
            <button class="ctrl-btn" id="btnMic" onclick="toggleAudio()" title="Ligar/Desligar Microfone">
                <svg id="iconMicOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <svg id="iconMicOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" x2="22" y1="2" y2="22"/>
                    <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
                    <path d="M5 10v2a7 7 0 0 0 12 5"/>
                    <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
            </button>

            <!-- BOTÃO CÂMERA -->
            <button class="ctrl-btn" id="btnCam" onclick="toggleVideo()" title="Ligar/Desligar Câmera">
                <svg id="iconCamOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
                    <rect x="2" y="6" width="14" height="12" rx="2"/>
                </svg>
                <svg id="iconCamOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" x2="22" y1="2" y2="22"/>
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
                    <path d="M2 6a2 2 0 0 1 2-2h10"/>
                    <path d="M2 18v-8"/>
                    <path d="M6 20h8a2 2 0 0 0 2-2v-4"/>
                </svg>
            </button>

            <!-- BOTÃO AJUSTAR ENQUADRAMENTO (SEM CORTES vs PREENCHER) -->
            <button class="ctrl-btn" id="btnFit" onclick="toggleFitMode()" title="Ajustar Enquadramento (Sem Cortes / Preencher)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
                    <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
                </svg>
            </button>

            <!-- BOTÃO MUDAR LAYOUT (GRID 50/50 vs DESTAQUE PiP) -->
            <button class="ctrl-btn" id="btnLayout" onclick="toggleLayoutMode()" title="Alternar Layout (Lado a Lado / Destaque)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2"/>
                    <path d="M12 3v18"/>
                </svg>
            </button>

            <!-- BOTÃO COMPARTILHAR TELA -->
            <button class="ctrl-btn" id="btnScreen" onclick="toggleScreenShare()" title="Compartilhar Tela" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="3" rx="2"/>
                    <line x1="8" x2="16" y1="21" y2="21"/>
                    <line x1="12" x2="12" y1="17" y2="21"/>
                    <polyline points="16 7 12 3 8 7"/>
                    <line x1="12" x2="12" y1="3" y2="13"/>
                </svg>
            </button>

            <!-- BOTÃO TELA CHEIA -->
            <button class="ctrl-btn" id="btnFullscreen" onclick="toggleStageFullscreen()" title="Tela Cheia">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>

            <!-- BOTÃO ENCERRAR (DESLIGAR) -->
            <button class="ctrl-btn btn-hangup" onclick="encerrarChamada()" title="Encerrar Consulta">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.99.99 0 0 1 0-1.41C3.28 8.77 7.42 7 12 7s8.72 1.77 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </main>

    <script>
        // ── ESTADO DA SALA WEBRTC ──
        let localStream = null;
        let remoteStream = null;
        let peer = null;
        let currentCall = null;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isAudioMuted = false;
        let isVideoMuted = false;
        let isScreenSharing = false;
        let isModerator = false;
        let isCoverFit = false;
        let currentLayout = 'grid'; // 'grid' | 'spotlight'
        let myPeerId = '';
        let targetPeerId = '';
        let connectRetryTimer = null;

        // ── LEITURA DE PARÂMETROS DE AGENDAMENTO (HORÁRIO E DURAÇÃO) ──
        const urlParams = new URLSearchParams(window.location.search);
        const scheduledTime = urlParams.get('time') || '';
        const durationMinutes = parseInt(urlParams.get('duration') || '60', 10);

        function computeEndTime(startStr, dur) {
            if (!startStr || !startStr.includes(':')) return '';
            const [h, m] = startStr.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return '';
            const total = h * 60 + m + dur;
            const endH = Math.floor((total % (24 * 60)) / 60);
            const endM = total % 60;
            return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
        }

        if (scheduledTime) {
            const end = computeEndTime(scheduledTime, durationMinutes);
            const pill = document.getElementById('callSchedulePill');
            const txt = document.getElementById('scheduleText');
            if (pill && txt) {
                txt.textContent = `${scheduledTime} às ${end} (${durationMinutes} min)`;
                pill.style.display = 'inline-flex';
            }
        }

        // ── UTILITÁRIOS & TOAST ──
        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, duration);
        }

        function setStatus(text, isConnected = false) {
            const statusEl = document.getElementById('callStatus');
            if (!statusEl) return;
            statusEl.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
            if (isConnected) {
                statusEl.classList.add('connected');
            } else {
                statusEl.classList.remove('connected');
            }
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                const textEl = document.getElementById('timerText');
                if (textEl) textEl.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ── CONTROLE DE ENQUADRAMENTO E LAYOUT ──
        function toggleFitMode() {
            isCoverFit = !isCoverFit;
            const stage = document.getElementById('stageContainer');
            const btn = document.getElementById('btnFit');
            if (isCoverFit) {
                stage.classList.add('fit-cover');
                if (btn) btn.classList.add('active');
                showToast('Enquadramento: Preencher Tela (com Zoom)');
            } else {
                stage.classList.remove('fit-cover');
                if (btn) btn.classList.remove('active');
                showToast('Enquadramento: 100% Visível (Sem Cortes)');
            }
        }

        function toggleLayoutMode() {
            const layout = document.getElementById('videosLayout');
            const btn = document.getElementById('btnLayout');
            if (currentLayout === 'grid') {
                currentLayout = 'spotlight';
                if (layout) layout.className = 'videos-layout-grid mode-spotlight';
                if (btn) btn.classList.remove('active');
                showToast('Layout: Destaque Principal + Miniatura');
            } else {
                currentLayout = 'grid';
                if (layout) layout.className = 'videos-layout-grid mode-grid';
                if (btn) btn.classList.add('active');
                showToast('Layout: Lado a Lado (Proporções Iguais)');
            }
        }

        function toggleStageFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        // ── INICIALIZAÇÃO DE MÍDIA NATIVA ──
        async function initLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                const localVideo = document.getElementById('localVideo');
                if (localVideo) {
                    localVideo.srcObject = localStream;
                }
                return true;
            } catch (err) {
                console.error('Erro ao obter câmera/microfone:', err);
                showToast('Permita o acesso à câmera e microfone para continuar.', 6000);
                setStatus('Câmera bloqueada');
                return false;
            }
        }

        // ── CONTROLE DE MÍDIA (MUTE / CAM / SCREEN) ──
        function toggleAudio() {
            if (!localStream) return;
            isAudioMuted = !isAudioMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isAudioMuted);
            const btn = document.getElementById('btnMic');
            const iconOn = document.getElementById('iconMicOn');
            const iconOff = document.getElementById('iconMicOff');
            
            if (isAudioMuted) {
                if (iconOn) iconOn.style.display = 'none';
                if (iconOff) iconOff.style.display = 'block';
                if (btn) btn.classList.add('off');
            } else {
                if (iconOn) iconOn.style.display = 'block';
                if (iconOff) iconOff.style.display = 'none';
                if (btn) btn.classList.remove('off');
            }
            showToast(isAudioMuted ? 'Microfone silenciado' : 'Microfone ativo');
        }

        function toggleVideo() {
            if (!localStream) return;
            isVideoMuted = !isVideoMuted;
            localStream.getVideoTracks().forEach(t => t.enabled = !isVideoMuted);
            const btn = document.getElementById('btnCam');
            const iconOn = document.getElementById('iconCamOn');
            const iconOff = document.getElementById('iconCamOff');

            if (isVideoMuted) {
                if (iconOn) iconOn.style.display = 'none';
                if (iconOff) iconOff.style.display = 'block';
                if (btn) btn.classList.add('off');
            } else {
                if (iconOn) iconOn.style.display = 'block';
                if (iconOff) iconOff.style.display = 'none';
                if (btn) btn.classList.remove('off');
            }
            showToast(isVideoMuted ? 'Câmera desligada' : 'Câmera ligada');
        }

        async function toggleScreenShare() {
            if (!navigator.mediaDevices.getDisplayMedia) {
                showToast('Compartilhamento de tela não suportado neste navegador.');
                return;
            }
            try {
                if (!isScreenSharing) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];

                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(screenTrack);
                    }

                    // Exibe a tela compartilhada com destaque total
                    const localVideo = document.getElementById('localVideo');
                    if (localVideo) {
                        localVideo.srcObject = screenStream;
                        localVideo.style.transform = 'none'; // Não espelha a tela compartilhada!
                    }

                    // Se estiver em modo spotlight ou grid, destaca o compartilhamento
                    const layout = document.getElementById('videosLayout');
                    if (layout) {
                        layout.className = 'videos-layout-grid mode-spotlight';
                    }

                    isScreenSharing = true;
                    const btnScreen = document.getElementById('btnScreen');
                    if (btnScreen) btnScreen.classList.add('active');
                    showToast('Compartilhando tela com visualização ao vivo');

                    screenTrack.onended = () => {
                        stopScreenShare();
                    };
                } else {
                    stopScreenShare();
                }
            } catch (e) {
                console.log('Cancelou compartilhamento de tela');
            }
        }

        function stopScreenShare() {
            if (!localStream) return;
            const camTrack = localStream.getVideoTracks()[0];
            if (currentCall && currentCall.peerConnection && camTrack) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(camTrack);
            }
            const localVideo = document.getElementById('localVideo');
            if (localVideo) {
                localVideo.srcObject = localStream;
                localVideo.style.transform = 'scaleX(-1)'; // Restaura espelhamento natural da câmera
            }
            isScreenSharing = false;
            const btnScreen = document.getElementById('btnScreen');
            if (btnScreen) btnScreen.classList.remove('active');
            
            // Restaura o layout escolhido
            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = `videos-layout-grid mode-${currentLayout}`;
            }
            showToast('Retornou para a câmera');
        }

        // ── MANIPULAÇÃO DA CHAMADA REMOTA ──
        function handleCallConnected(call, remoteStreamObj) {
            currentCall = call;
            remoteStream = remoteStreamObj;

            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = remoteStreamObj;
            }

            // Oculta o banner de espera e ativa o layout da chamada
            const banner = document.getElementById('waitingBanner');
            if (banner) banner.style.display = 'none';

            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = `videos-layout-grid mode-${currentLayout}`;
            }

            const btnLayout = document.getElementById('btnLayout');
            if (btnLayout && currentLayout === 'grid') {
                btnLayout.classList.add('active');
            }

            setStatus('Conectado em HD', true);
            startTimer();
            showToast('Teleconsulta conectada com sucesso!', 4000);

            if (connectRetryTimer) {
                clearInterval(connectRetryTimer);
                connectRetryTimer = null;
            }

            call.on('close', () => {
                handleCallDisconnected();
            });
        }

        function handleCallDisconnected() {
            const banner = document.getElementById('waitingBanner');
            if (banner) {
                banner.style.display = 'flex';
                document.getElementById('waitingTitle').textContent = 'Participante Desconectou';
                document.getElementById('waitingDesc').textContent = 'Sua câmera continua ativa. Aguardando reconexão...';
            }

            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = 'videos-layout-grid mode-waiting';
            }

            setStatus('Aguardando reconexão...');
            stopTimer();

            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) remoteVideo.srcObject = null;

            if (isModerator && !connectRetryTimer) {
                iniciarTentativaDeChamada();
            }
        }

        function iniciarTentativaDeChamada() {
            if (!localStream || !peer || currentCall?.open) return;

            function tentarChamar() {
                if (currentCall && currentCall.open) return;
                try {
                    const call = peer.call(targetPeerId, localStream);
                    if (call) {
                        call.on('stream', (stream) => {
                            handleCallConnected(call, stream);
                        });
                        call.on('error', (e) => {
                            console.log('Tentativa de chamada pendente...', e);
                        });
                    }
                } catch(err) {
                    console.log('Aguardando paciente estar online...');
                }
            }

            tentarChamar();
            if (!connectRetryTimer) {
                connectRetryTimer = setInterval(tentarChamar, 1200);
            }
        }

        function encerrarChamada() {
            stopTimer();
            if (connectRetryTimer) {
                clearInterval(connectRetryTimer);
                connectRetryTimer = null;
            }
            if (currentCall) {
                try { currentCall.close(); } catch(e){}
            }
            if (peer) {
                try { peer.destroy(); } catch(e){}
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CALL_ENDED', action: 'CLOSED' }, '*');
                window.parent.postMessage({ type: 'JITSI_LEFT', action: 'CLOSED' }, '*');
            } else {
                window.close();
                setTimeout(() => { window.location.href = 'index.html'; }, 300);
            }
        }

        // ── INICIALIZAÇÃO PRINCIPAL WEBRTC ULTRA-RÁPIDA (PEER-TO-PEER) ──
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const rawRoom = params.get('room') || 'geral';
            const cleanRoom = rawRoom.toLowerCase().replace(/[^a-z0-9]/g, '');
            const userName = params.get('name') || params.get('user') || 'Participante';
            const roleParam = params.get('role');
            const isMinimal = params.get('minimal') === 'true';

            isModerator = roleParam === 'moderator' || (userName && userName.toLowerCase().includes('silvia'));

            if (isMinimal) {
                const header = document.getElementById('callHeader');
                if (header) header.style.display = 'none';
            }

            if (isModerator) {
                myPeerId = `nutri_${cleanRoom}`;
                targetPeerId = `pac_${cleanRoom}`;
                document.getElementById('localNameText').textContent = 'Dra. Silvia';
                document.getElementById('remoteNameText').textContent = userName.includes('Silvia') ? 'Paciente' : userName;
                document.getElementById('waitingTitle').textContent = 'Aguardando o Paciente...';
                document.getElementById('waitingDesc').textContent = 'Assim que o paciente acessar o portal, a teleconsulta iniciará imediatamente.';
                const btnScreen = document.getElementById('btnScreen');
                if (btnScreen) btnScreen.style.display = 'flex';
            } else {
                myPeerId = `pac_${cleanRoom}`;
                targetPeerId = `nutri_${cleanRoom}`;
                document.getElementById('localNameText').textContent = userName || 'Você';
                document.getElementById('remoteNameText').textContent = 'Dra. Silvia Oliveira Lemos';
                document.getElementById('waitingTitle').textContent = 'Aguardando a Nutricionista...';
                document.getElementById('waitingDesc').textContent = 'Dra. Silvia já está conectando seu prontuário para iniciar o atendimento.';
            }

            setStatus('Iniciando câmera...');
            const streamOk = await initLocalStream();
            if (!streamOk) return;

            setStatus('Conectando à sala...');

            const rtcConfig = {
                iceServers: [
                    { urls: 'stun:stun.cloudflare.com:3478' },
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    {
                        urls: [
                            'turn:openrelay.metered.ca:80',
                            'turn:openrelay.metered.ca:443',
                            'turn:openrelay.metered.ca:443?transport=tcp'
                        ],
                        username: 'openrelay',
                        credential: 'openrelay'
                    }
                ],
                iceCandidatePoolSize: 10,
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require',
                sdpSemantics: 'unified-plan'
            };

            function initPeer(peerId) {
                try {
                    peer = new Peer(peerId, {
                        config: rtcConfig,
                        debug: 1
                    });

                    peer.on('open', (id) => {
                        console.log('PeerJS Conectado com sucesso. ID:', id);
                        setStatus('Sala conectada. Pronto.');

                        if (isModerator) {
                            iniciarTentativaDeChamada();
                        } else {
                            // Paciente notifica que está pronto e pode ligar se o moderador já estiver ativo
                            iniciarTentativaDeChamada();
                        }
                    });

                    peer.on('call', (incomingCall) => {
                        console.log('Recebendo chamada WebRTC de:', incomingCall.peer);
                        incomingCall.answer(localStream);

                        incomingCall.on('stream', (remoteStreamObj) => {
                            handleCallConnected(incomingCall, remoteStreamObj);
                        });

                        incomingCall.on('close', () => {
                            handleCallDisconnected();
                        });
                    });

                    peer.on('error', (err) => {
                        console.warn('Alerta na conexão P2P:', err.type, err);
                        if (err.type === 'peer-unavailable') {
                            // Participante ainda conectando
                        } else if (err.type === 'unavailable-id') {
                            console.log('ID temporariamente ocupado, restabelecendo sessão...');
                            setTimeout(() => {
                                try { peer.destroy(); } catch(e){}
                                initPeer(`${peerId}_${Date.now().toString().slice(-4)}`);
                            }, 500);
                        }
                    });

                } catch (err) {
                    console.error('Falha ao inicializar WebRTC:', err);
                    setStatus('Erro ao conectar');
                }
            }

            initPeer(myPeerId);
        };

        window.addEventListener('beforeunload', () => {
            encerrarChamada();
        });
    </script>
</body>
</html>
