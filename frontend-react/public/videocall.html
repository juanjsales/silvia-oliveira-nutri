<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleconsulta Nutricional · Dra. Silvia Oliveira Lemos</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #070d09;
            --bg-card: #0e1a12;
            --bg-header: #122218;
            --forest-deep: #162b1e;
            --sage-accent: #8ca481;
            --sage-glow: #34d399;
            --text-title: #ffffff;
            --text-body: #e4ebe1;
            --text-muted: #9ab390;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-body);
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── HEADER ── */
        .call-header {
            background: var(--bg-header);
            border-bottom: 1px solid rgba(140, 164, 129, 0.2);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            flex-shrink: 0;
            z-index: 50;
        }

        .call-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(140, 164, 129, 0.15);
            border: 1px solid rgba(140, 164, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sage-glow);
            flex-shrink: 0;
        }

        .call-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
        }

        .call-security-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--sage-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(140, 164, 129, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(140, 164, 129, 0.2);
        }

        .call-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fbbf24;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .call-status.connected {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.4);
            color: #34d399;
        }

        .call-timer {
            font-family: monospace;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--sage-accent);
            background: rgba(140, 164, 129, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(140, 164, 129, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .call-schedule-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 800;
            color: #d1fae5;
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        /* ── VIDEO STAGE ── */
        .stage-container {
            flex: 1;
            position: relative;
            background: #040805;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* ── CONTAINER PRINCIPAL DOS VÍDEOS ── */
        .videos-layout-grid {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* MODO 1: DESTAQUE (Principal + Miniatura PiP) */
        .videos-layout-grid.mode-spotlight {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .videos-layout-grid.mode-spotlight .remote-video-wrap {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #040805;
            z-index: 1;
        }

        .videos-layout-grid.mode-spotlight .local-video-wrap {
            position: absolute;
            bottom: 84px;
            right: 20px;
            width: clamp(140px, 22vw, 220px);
            aspect-ratio: 16 / 9;
            height: auto;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(140, 164, 129, 0.5);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            background: #0d1710;
            z-index: 25;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .videos-layout-grid.mode-spotlight .local-video-wrap:hover {
            transform: scale(1.04);
            border-color: var(--sage-glow);
        }

        /* MODO 2: LADO A LADO / GRID (Proporções Perfeitas) */
        .videos-layout-grid.mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px;
            padding-bottom: 64px;
            width: 100%;
            height: 100%;
            align-items: stretch;
        }

        .videos-layout-grid.mode-grid .remote-video-wrap,
        .videos-layout-grid.mode-grid .local-video-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #08120a;
            border: 1.5px solid rgba(140, 164, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            bottom: auto;
            right: auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* MODO 3: PRÉVIA LOCAL (Enquanto aguarda a outra pessoa) */
        .videos-layout-grid.mode-waiting .remote-video-wrap {
            display: none;
        }

        .videos-layout-grid.mode-waiting .local-video-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #040805;
        }

        /* ── ELEMENTOS DE VÍDEO ── */
        .video-element,
        #remoteVideo,
        #localVideo {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover !important;
            object-position: center 24% !important;
            background: #040805;
            transition: object-fit 0.2s ease;
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Modo Sem Cortes (se alternar no botão de enquadramento) */
        .stage-container.fit-contain-mode .video-element,
        .stage-container.fit-contain-mode #remoteVideo,
        .stage-container.fit-contain-mode #localVideo {
            object-fit: contain !important;
        }

        #localVideo {
            transform: scaleX(-1); /* espelha câmera própria */
        }

        /* Se for compartilhamento de tela, sempre manter 100% legível */
        .video-wrap-screen-share .video-element,
        .video-wrap-screen-share #remoteVideo,
        .video-wrap-screen-share #localVideo {
            object-fit: contain !important;
            transform: none !important;
            object-position: center !important;
        }

        /* Ao compartilhar, a tela local vira o conteúdo principal e a outra pessoa fica em PiP. */
        .videos-layout-grid.mode-spotlight.screen-share-local .local-video-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            aspect-ratio: auto;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            z-index: 1;
            cursor: default;
        }

        .videos-layout-grid.mode-spotlight.screen-share-local .local-video-wrap:hover {
            transform: none;
        }

        .videos-layout-grid.mode-spotlight.screen-share-local .remote-video-wrap {
            inset: auto 20px 84px auto;
            width: clamp(140px, 22vw, 220px);
            height: auto;
            aspect-ratio: 16 / 9;
            border: 2px solid rgba(140, 164, 129, 0.5);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            z-index: 25;
        }

        @media (max-width: 720px), (max-aspect-ratio: 1/1) {
            .videos-layout-grid.mode-grid {
                grid-template-columns: 1fr !important;
                grid-template-rows: 1fr 1fr !important;
                gap: 8px !important;
                padding: 8px !important;
                padding-bottom: 64px !important;
            }

            .videos-layout-grid.mode-spotlight .local-video-wrap {
                bottom: 68px !important;
                right: 10px !important;
                width: 110px !important;
            }
        }

        .waiting-status-banner {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 26, 18, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(140, 164, 129, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 30;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            animation: fadeInDown 0.3s ease;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        .waiting-status-banner .pulse-dot-large {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--sage-glow);
            box-shadow: 0 0 8px var(--sage-glow);
            animation: pulse-ring 1.8s infinite;
            flex-shrink: 0;
        }

        .waiting-status-banner strong {
            font-size: 0.78rem;
            color: #ffffff;
            font-weight: 700;
            line-height: 1;
        }

        .waiting-status-banner small {
            font-size: 0.66rem;
            color: #c9d8cb;
            display: block;
            margin-top: 2px;
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.72);
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            color: #ffffff;
            backdrop-filter: blur(6px);
            pointer-events: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.14);
            z-index: 10;
        }

        /* ── FLOATING CONTROLS (PIXEL-PERFECT ALIGNMENT) ── */
        .controls-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(12, 22, 16, 0.88);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(140, 164, 129, 0.35);
            padding: 6px 14px;
            border-radius: 32px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.7);
            z-index: 40;
            max-width: calc(100% - 24px);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            overscroll-behavior-x: contain;
        }

        .controls-bar::-webkit-scrollbar { display: none; }

        .ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(140, 164, 129, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 0 !important;
            padding: 0 !important;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            flex-shrink: 0;
        }

        .ctrl-btn svg {
            width: 17px;
            height: 17px;
            display: block;
            margin: auto;
            stroke-width: 2;
        }

        .ctrl-btn:hover {
            background: rgba(140, 164, 129, 0.3);
            border-color: var(--sage-accent);
            transform: translateY(-1px);
        }

        .ctrl-btn:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        .ctrl-btn.active {
            background: var(--sage-glow) !important;
            color: #070d09 !important;
            border-color: var(--sage-glow) !important;
        }

        .ctrl-btn.off {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.75);
            color: #fca5a5;
        }

        .ctrl-btn.btn-hangup {
            background: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
            width: 38px;
            height: 38px;
            margin-left: 2px;
        }

        .ctrl-btn.btn-hangup:hover {
            background: #dc2626;
            border-color: #dc2626;
            transform: translateY(-1px) scale(1.04);
        }

        /* ── TOAST NOTIFICATIONS ── */
        .toast-msg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 26, 18, 0.94);
            border: 1px solid var(--sage-accent);
            color: #e4ebe1;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 700;
            z-index: 50;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7);
            display: none;
            backdrop-filter: blur(12px);
            animation: slide-toast 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-toast {
            from { transform: translate(-50%, -12px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* ── MODO EMBEDDED (SPLIT NO PRONTUÁRIO OU MINIPLAYER) ── */
        body.is-embedded .call-header {
            display: none !important;
        }
        body.is-embedded .controls-bar {
            bottom: 12px !important;
            padding: 5px 10px !important;
            gap: 6px !important;
        }
        body.is-embedded .ctrl-btn {
            width: 36px !important;
            height: 36px !important;
        }
        body.is-embedded .ctrl-btn svg {
            width: 15px !important;
            height: 15px !important;
        }
        body.is-embedded .waiting-status-banner {
            top: 10px !important;
            padding: 5px 12px !important;
        }
        body.is-embedded .waiting-status-banner strong {
            font-size: 0.74rem !important;
        }
        body.is-embedded .waiting-status-banner small {
            display: none !important;
        }

        /* Split compacto / tablet: prioriza uma área de vídeo utilizável. */
        @media (max-width: 768px), (max-height: 560px) {
            .videos-layout-grid.mode-grid {
                grid-template-columns: 1fr !important;
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) !important;
                gap: 6px !important;
                padding: 6px 6px calc(66px + env(safe-area-inset-bottom, 0px)) !important;
            }
            .videos-layout-grid.mode-grid .remote-video-wrap,
            .videos-layout-grid.mode-grid .local-video-wrap {
                width: 100%;
                height: 100%;
                min-height: 0;
                border-radius: 10px;
            }
            .videos-layout-grid.mode-spotlight.screen-share-local .local-video-wrap {
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                border-radius: 0;
            }
            .videos-layout-grid.mode-spotlight.screen-share-local .remote-video-wrap {
                inset: auto 10px calc(70px + env(safe-area-inset-bottom, 0px)) auto;
                width: clamp(104px, 31vw, 160px);
                height: auto;
                border-radius: 10px;
            }
            .videos-layout-grid.mode-spotlight .local-video-wrap {
                width: clamp(104px, 31vw, 160px) !important;
                height: auto !important;
                bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important;
                right: 10px !important;
                border-radius: 10px;
            }
            .controls-bar {
                width: max-content;
                max-width: calc(100% - 16px);
                gap: 5px;
                padding: 5px 8px;
                bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            }
            .ctrl-btn { width: 38px; height: 38px; min-width: 38px; }
            .ctrl-btn svg { width: 16px; height: 16px; }
            .ctrl-btn.btn-hangup { width: 42px; height: 42px; }
            .waiting-status-banner {
                top: 8px;
                max-width: calc(100% - 20px);
                white-space: normal;
            }
            .video-label { bottom: 6px; left: 6px; }
        }

        /* Celulares estreitos: controles nunca ultrapassam a viewport. */
        @media (max-width: 430px) {
            .controls-bar {
                width: calc(100% - 12px);
                justify-content: space-between;
                border-radius: 18px;
                padding-inline: 6px;
            }
            .ctrl-btn,
            body.is-embedded .ctrl-btn {
                width: 36px !important;
                min-width: 36px;
                height: 36px !important;
            }
            .ctrl-btn.btn-hangup,
            body.is-embedded .ctrl-btn.btn-hangup {
                width: 40px !important;
                min-width: 40px;
                height: 40px !important;
            }
            .videos-layout-grid.mode-spotlight .local-video-wrap {
                width: clamp(96px, 29vw, 124px) !important;
            }
            .videos-layout-grid.mode-spotlight.screen-share-local .local-video-wrap {
                width: 100% !important;
            }
            .videos-layout-grid.mode-spotlight.screen-share-local .remote-video-wrap {
                width: clamp(96px, 29vw, 124px);
            }
            .waiting-status-banner strong { font-size: 0.72rem; }
        }

        /* Iframes muito pequenos (miniplayer): vídeo principal + controles essenciais legíveis. */
        @media (max-height: 320px) {
            .videos-layout-grid.mode-grid {
                display: block;
                padding: 0 !important;
            }
            .videos-layout-grid.mode-grid .remote-video-wrap {
                position: absolute;
                inset: 0;
            }
            .videos-layout-grid.mode-grid .local-video-wrap {
                position: absolute;
                right: 8px;
                bottom: calc(58px + env(safe-area-inset-bottom, 0px));
                width: min(32%, 112px);
                height: auto;
                aspect-ratio: 16 / 9;
                z-index: 25;
            }
            .controls-bar,
            body.is-embedded .controls-bar {
                bottom: calc(6px + env(safe-area-inset-bottom, 0px)) !important;
            }
            .waiting-status-banner { top: 6px !important; }
        }
    </style>
</head>
<body class="is-embedded">

    <!-- CABEÇALHO -->
    <header class="call-header" id="callHeader">
        <div class="call-brand">
            <div class="brand-icon-wrap" title="Dra. Silvia Oliveira Lemos" style="width:34px; height:34px; border-radius:50%; overflow:hidden; border:none; padding:0; background:transparent; display:flex; align-items:center; justify-content:center;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="50" cy="50" r="48" fill="#203528" stroke="#8ca481" stroke-width="3"/>
                    <path d="M 50 18 Q 72 40 50 82 Q 28 40 50 18 Z" fill="#8ca481" />
                    <path d="M 50 18 L 50 82" stroke="#203528" stroke-width="2.5" stroke-linecap="round" />
                    <path d="M 50 42 Q 62 34 68 32" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
                    <path d="M 50 55 Q 38 47 32 45" stroke="#203528" stroke-width="2" stroke-linecap="round" fill="none" />
                    <circle cx="68" cy="32" r="2.5" fill="#203528" />
                    <circle cx="32" cy="45" r="2.5" fill="#203528" />
                </svg>
            </div>
            <div>
                <div class="call-title" id="headerTitle">Teleconsulta Nutricional</div>
                <div style="font-size:0.7rem; color:var(--text-muted)" id="headerSub">Dra. Silvia Oliveira Lemos · CRN-1 12345</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px">
            <div class="call-schedule-pill" id="callSchedulePill" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="scheduleText"></span>
            </div>
            <span class="call-security-badge" title="Conexão direta ponta a ponta criptografada">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                P2P Seguro
            </span>
            <span class="call-status" id="callStatus">
                <span class="status-dot"></span>
                <span>Iniciando câmera...</span>
            </span>
            <div class="call-timer" id="callTimer">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="timerText">00:00</span>
            </div>
        </div>
    </header>

    <!-- PALCO DE VÍDEO -->
    <main class="stage-container" id="stageContainer">
        <div id="toastMsg" class="toast-msg"></div>

        <!-- BANNER DE STATUS DE ESPERA -->
        <div class="waiting-status-banner" id="waitingBanner">
            <div class="pulse-dot-large"></div>
            <div>
                <strong id="waitingTitle">Sua câmera está pronta</strong>
                <small id="waitingDesc">Aguardando o participante conectar à sala...</small>
            </div>
        </div>

        <!-- LAYOUT DE VÍDEOS (INICIA EM MODO ESPERA/PREVIEW) -->
        <div class="videos-layout-grid mode-waiting" id="videosLayout">
            <!-- VÍDEO REMOTO (OUTRA PESSOA) -->
            <div class="remote-video-wrap" id="remoteVideoBox">
                <video id="remoteVideo" class="video-element" autoplay playsinline></video>
                <div class="video-label" id="remoteLabel">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="remoteNameText">Paciente</span>
                </div>
            </div>

            <!-- VÍDEO LOCAL (SUA CÂMERA) -->
            <div class="local-video-wrap" id="localVideoBox" title="Clique para alternar destaque">
                <video id="localVideo" class="video-element" autoplay playsinline muted></video>
                <div class="video-label" id="localLabel">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="localNameText">Você</span>
                </div>
            </div>
        </div>

        <!-- CONTROLES FLUTUANTES -->
        <div class="controls-bar">
            <!-- BOTÃO MICROFONE -->
            <button class="ctrl-btn" id="btnMic" onclick="toggleAudio()" title="Ligar/Desligar Microfone" aria-label="Ligar ou desligar microfone">
                <svg id="iconMicOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <svg id="iconMicOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" x2="22" y1="2" y2="22"/>
                    <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
                    <path d="M5 10v2a7 7 0 0 0 12 5"/>
                    <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
            </button>

            <!-- BOTÃO CÂMERA -->
            <button class="ctrl-btn" id="btnCam" onclick="toggleVideo()" title="Ligar/Desligar Câmera" aria-label="Ligar ou desligar câmera">
                <svg id="iconCamOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
                    <rect x="2" y="6" width="14" height="12" rx="2"/>
                </svg>
                <svg id="iconCamOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" x2="22" y1="2" y2="22"/>
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
                    <path d="M2 6a2 2 0 0 1 2-2h10"/>
                    <path d="M2 18v-8"/>
                    <path d="M6 20h8a2 2 0 0 0 2-2v-4"/>
                </svg>
            </button>

            <!-- BOTÃO AJUSTAR ENQUADRAMENTO (SEM CORTES vs PREENCHER) -->
            <button class="ctrl-btn" id="btnFit" onclick="toggleFitMode()" title="Ajustar Enquadramento (Sem Cortes / Preencher)" aria-label="Alternar enquadramento do vídeo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
                    <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
                </svg>
            </button>

            <!-- BOTÃO MUDAR LAYOUT (GRID 50/50 vs DESTAQUE PiP) -->
            <button class="ctrl-btn" id="btnLayout" onclick="toggleLayoutMode()" title="Alternar Layout (Lado a Lado / Destaque)" aria-label="Alternar disposição dos vídeos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2"/>
                    <path d="M12 3v18"/>
                </svg>
            </button>

            <!-- BOTÃO COMPARTILHAR TELA -->
            <button class="ctrl-btn" id="btnScreen" onclick="toggleScreenShare()" title="Compartilhar Tela" aria-label="Iniciar ou parar compartilhamento de tela" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="3" rx="2"/>
                    <line x1="8" x2="16" y1="21" y2="21"/>
                    <line x1="12" x2="12" y1="17" y2="21"/>
                    <polyline points="16 7 12 3 8 7"/>
                    <line x1="12" x2="12" y1="3" y2="13"/>
                </svg>
            </button>

            <!-- BOTÃO TELA CHEIA -->
            <button class="ctrl-btn" id="btnFullscreen" onclick="toggleStageFullscreen()" title="Tela Cheia" aria-label="Alternar tela cheia">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>

            <!-- BOTÃO ENCERRAR (DESLIGAR) -->
            <button class="ctrl-btn btn-hangup" onclick="encerrarChamada()" title="Encerrar Consulta" aria-label="Encerrar consulta">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.99.99 0 0 1 0-1.41C3.28 8.77 7.42 7 12 7s8.72 1.77 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </main>

    <script>
        // ── ESTADO DA SALA WEBRTC ──
        let localStream = null;
        let remoteStream = null;
        let peer = null;
        let currentCall = null;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isAudioMuted = false;
        let isVideoMuted = false;
        let isScreenSharing = false;
        let isModerator = false;
        let isCoverFit = false;
        let currentLayout = 'grid'; // 'grid' | 'spotlight'
        let myPeerId = '';
        let targetPeerId = '';
        let connectRetryTimer = null;
        let connectRetryCount = 0;
        let sessionId = '';
        let joinToken = '';
        let heartbeatTimer = null;
        const parentOrigin = window.location.origin;

        // ── LEITURA DE PARÂMETROS DE AGENDAMENTO (HORÁRIO E DURAÇÃO) ──
        const urlParams = new URLSearchParams(window.location.search);
        let scheduledTime = '';
        let durationMinutes = 60;

        function computeEndTime(startStr, dur) {
            if (!startStr || !startStr.includes(':')) return '';
            const [h, m] = startStr.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return '';
            const total = h * 60 + m + dur;
            const endH = Math.floor((total % (24 * 60)) / 60);
            const endM = total % 60;
            return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
        }

        if (scheduledTime) {
            const end = computeEndTime(scheduledTime, durationMinutes);
            const pill = document.getElementById('callSchedulePill');
            const txt = document.getElementById('scheduleText');
            if (pill && txt) {
                txt.textContent = `${scheduledTime} às ${end} (${durationMinutes} min)`;
                pill.style.display = 'inline-flex';
            }
        }

        // ── UTILITÁRIOS & TOAST ──
        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, duration);
        }

        function setStatus(text, isConnected = false) {
            const statusEl = document.getElementById('callStatus');
            if (!statusEl) return;
            statusEl.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
            if (isConnected) {
                statusEl.classList.add('connected');
            } else {
                statusEl.classList.remove('connected');
            }
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                const textEl = document.getElementById('timerText');
                if (textEl) textEl.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ── INICIALIZAÇÃO DE MÍDIA NATIVA ──
        async function initLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                const localVideo = document.getElementById('localVideo');
                if (localVideo) {
                    localVideo.srcObject = localStream;
                }
                return true;
            } catch (err) {
                console.error('Erro ao obter câmera/microfone:', err);
                showToast('Permita o acesso à câmera e microfone para continuar.', 6000);
                setStatus('Câmera bloqueada');
                return false;
            }
        }

        // ── CONTROLE DE MÍDIA (MUTE / CAM / SCREEN) ──
        function toggleAudio() {
            if (!localStream) return;
            isAudioMuted = !isAudioMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isAudioMuted);
            const btn = document.getElementById('btnMic');
            const iconOn = document.getElementById('iconMicOn');
            const iconOff = document.getElementById('iconMicOff');
            
            if (isAudioMuted) {
                if (iconOn) iconOn.style.display = 'none';
                if (iconOff) iconOff.style.display = 'block';
                if (btn) btn.classList.add('off');
            } else {
                if (iconOn) iconOn.style.display = 'block';
                if (iconOff) iconOff.style.display = 'none';
                if (btn) btn.classList.remove('off');
            }
            showToast(isAudioMuted ? 'Microfone silenciado' : 'Microfone ativo');
        }

        function toggleVideo() {
            if (!localStream) return;
            isVideoMuted = !isVideoMuted;
            localStream.getVideoTracks().forEach(t => t.enabled = !isVideoMuted);
            const btn = document.getElementById('btnCam');
            const iconOn = document.getElementById('iconCamOn');
            const iconOff = document.getElementById('iconCamOff');

            if (isVideoMuted) {
                if (iconOn) iconOn.style.display = 'none';
                if (iconOff) iconOff.style.display = 'block';
                if (btn) btn.classList.add('off');
            } else {
                if (iconOn) iconOn.style.display = 'block';
                if (iconOff) iconOff.style.display = 'none';
                if (btn) btn.classList.remove('off');
            }
            showToast(isVideoMuted ? 'Câmera desligada' : 'Câmera ligada');
        }

        async function toggleScreenShare() {
            if (!navigator.mediaDevices.getDisplayMedia) {
                showToast('Compartilhamento de tela não suportado neste navegador.');
                return;
            }
            try {
                if (!isScreenSharing) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];

                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(screenTrack);
                    }

                    // Exibe a tela compartilhada com destaque total
                    const localVideo = document.getElementById('localVideo');
                    const localVideoBox = document.getElementById('localVideoBox');
                    if (localVideo) {
                        localVideo.srcObject = screenStream;
                        localVideo.style.transform = 'none'; // Não espelha a tela compartilhada!
                    }
                    if (localVideoBox) localVideoBox.classList.add('video-wrap-screen-share');

                    // Se estiver em modo spotlight ou grid, destaca o compartilhamento
                    const layout = document.getElementById('videosLayout');
                    if (layout) {
                        layout.className = 'videos-layout-grid mode-spotlight screen-share-local';
                    }

                    isScreenSharing = true;
                    const btnScreen = document.getElementById('btnScreen');
                    if (btnScreen) btnScreen.classList.add('active');
                    showToast('Compartilhando tela com visualização ao vivo');

                    screenTrack.onended = () => {
                        stopScreenShare();
                    };
                } else {
                    stopScreenShare();
                }
            } catch (e) {
                console.log('Cancelou compartilhamento de tela');
            }
        }

        function stopScreenShare() {
            if (!localStream) return;
            const camTrack = localStream.getVideoTracks()[0];
            if (currentCall && currentCall.peerConnection && camTrack) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(camTrack);
            }
            const localVideo = document.getElementById('localVideo');
            const localVideoBox = document.getElementById('localVideoBox');
            if (localVideo) {
                localVideo.srcObject = localStream;
                localVideo.style.transform = 'scaleX(-1)'; // Restaura espelhamento natural da câmera
            }
            if (localVideoBox) localVideoBox.classList.remove('video-wrap-screen-share');
            isScreenSharing = false;
            const btnScreen = document.getElementById('btnScreen');
            if (btnScreen) btnScreen.classList.remove('active');
            
            // Restaura o layout escolhido
            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = `videos-layout-grid mode-${currentLayout}`;
            }
            showToast('Retornou para a câmera');
        }

        // ── AJUSTES DE ENQUADRAMENTO E LAYOUT ──
        function toggleFitMode() {
            isCoverFit = !isCoverFit;
            const stage = document.getElementById('stageContainer');
            const btnFit = document.getElementById('btnFit');
            if (stage) {
                stage.classList.toggle('fit-contain-mode', isCoverFit);
            }
            if (btnFit) {
                btnFit.classList.toggle('active', isCoverFit);
            }
            showToast(isCoverFit ? 'Enquadramento: Sem Cortes (Contain)' : 'Enquadramento: Otimizado para Rosto (Cover)');
        }

        function toggleLayoutMode() {
            currentLayout = currentLayout === 'grid' ? 'spotlight' : 'grid';
            const layout = document.getElementById('videosLayout');
            if (layout && !layout.classList.contains('mode-waiting')) {
                layout.className = `videos-layout-grid mode-${currentLayout}`;
            }
            const btnLayout = document.getElementById('btnLayout');
            if (btnLayout) {
                btnLayout.classList.toggle('active', currentLayout === 'grid');
            }
            showToast(currentLayout === 'grid' ? 'Layout: Lado a Lado' : 'Layout: Destaque com Miniatura');
        }

        function toggleStageFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.().catch(() => {});
                document.getElementById('btnFullscreen')?.classList.add('active');
            } else {
                document.exitFullscreen?.().catch(() => {});
                document.getElementById('btnFullscreen')?.classList.remove('active');
            }
        }

        // ── MANIPULAÇÃO DA CHAMADA REMOTA ──
        function handleCallConnected(call, remoteStreamObj) {
            currentCall = call;
            remoteStream = remoteStreamObj;

            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = remoteStreamObj;
            }

            // Oculta o banner de espera e ativa o layout da chamada
            const banner = document.getElementById('waitingBanner');
            if (banner) banner.style.display = 'none';

            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = `videos-layout-grid mode-${currentLayout}`;
            }

            const btnLayout = document.getElementById('btnLayout');
            if (btnLayout && currentLayout === 'grid') {
                btnLayout.classList.add('active');
            }

            setStatus('Conectado em HD', true);
            startTimer();
            showToast('Teleconsulta conectada com sucesso!', 4000);
            void sendHeartbeat('CONNECTED');

            if (connectRetryTimer) {
                clearTimeout(connectRetryTimer);
                connectRetryTimer = null;
            }

            call.on('close', () => {
                handleCallDisconnected();
            });
        }

        function handleCallDisconnected() {
            void sendHeartbeat('RECONNECTING');
            const banner = document.getElementById('waitingBanner');
            if (banner) {
                banner.style.display = 'flex';
                document.getElementById('waitingTitle').textContent = 'Participante Desconectou';
                document.getElementById('waitingDesc').textContent = 'Sua câmera continua ativa. Aguardando reconexão...';
            }

            const layout = document.getElementById('videosLayout');
            if (layout) {
                layout.className = 'videos-layout-grid mode-waiting';
            }

            setStatus('Aguardando reconexão...');
            stopTimer();

            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) remoteVideo.srcObject = null;

            connectRetryCount = 0;
            if (isModerator) scheduleConnectionAttempt();
        }

        function encerrarChamada() {
            stopTimer();
            if (connectRetryTimer) {
                clearTimeout(connectRetryTimer);
                connectRetryTimer = null;
            }
            if (currentCall) {
                try { currentCall.close(); } catch(e){}
            }
            if (peer) {
                try { peer.destroy(); } catch(e){}
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'TELECONSULT_CALL_ENDED', version: 1, sessionId }, parentOrigin);
            } else {
                window.close();
                setTimeout(() => { window.location.href = 'index.html'; }, 300);
            }
        }

        async function joinAuthorizedSession() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            sessionId = fragment.get('sessionId') || '';
            joinToken = fragment.get('joinToken') || '';
            history.replaceState(null, '', `${location.pathname}${location.search}`);
            if (!sessionId || !joinToken || !/^[a-zA-Z0-9_-]{8,}$/.test(sessionId)) {
                throw new Error('Link de acesso inválido ou incompleto. Solicite um novo acesso pelo portal.');
            }
            const response = await fetch(`/api/video/sessions/${encodeURIComponent(sessionId)}/join`, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ joinToken })
            });
            joinToken = '';
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload?.data) {
                throw new Error(payload?.error || payload?.message || 'Não foi possível validar esta teleconsulta.');
            }
            const data = payload.data;
            if (!data.roomKey || !['PROFESSIONAL', 'PATIENT'].includes(data.participantRole)) {
                throw new Error('O servidor retornou uma sessão inválida.');
            }
            return data;
        }

        async function sendHeartbeat(state) {
            if (!sessionId) return null;
            try {
                const response = await fetch(`/api/video/sessions/${encodeURIComponent(sessionId)}/heartbeat`, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(state ? { state } : {})
                });
                const payload = await response.json().catch(() => ({}));
                return response.ok ? payload?.data || null : null;
            } catch (_) { return null; }
        }

        function scheduleConnectionAttempt() {
            if (!isModerator || !localStream || !peer || currentCall?.open || connectRetryTimer) return;
            const delays = [1000, 1800, 3000, 5000, 8000, 12000];
            const attempt = async () => {
                connectRetryTimer = null;
                if (currentCall?.open || connectRetryCount >= delays.length) {
                    if (!currentCall?.open) setStatus('Não foi possível conectar. Use Reconectar.');
                    return;
                }
                const presence = await sendHeartbeat();
                if (!presence?.patientPresent) {
                    setStatus('Aguardando o paciente entrar...');
                    connectRetryTimer = setTimeout(attempt, 3000);
                    return;
                }
                connectRetryCount += 1;
                try {
                    const call = peer.call(targetPeerId, localStream);
                    if (call) call.on('stream', stream => handleCallConnected(call, stream));
                } catch (_) {}
                connectRetryTimer = setTimeout(attempt, delays[connectRetryCount - 1]);
            };
            attempt();
        }

        // ── INICIALIZAÇÃO PRINCIPAL AUTORIZADA PELO SERVIDOR ──
        window.onload = async () => {
            let authorized;
            try {
                setStatus('Validando acesso seguro...');
                authorized = await joinAuthorizedSession();
            } catch (error) {
                setStatus('Acesso não autorizado');
                showToast(error instanceof Error ? error.message : 'Falha ao validar acesso.', 8000);
                return;
            }
            const cleanRoom = String(authorized.roomKey).replace(/[^a-zA-Z0-9_-]/g, '');
            isModerator = authorized.participantRole === 'PROFESSIONAL';
            const isMinimal = urlParams.get('minimal') === 'true';
            void sendHeartbeat();
            heartbeatTimer = setInterval(() => void sendHeartbeat(), 12000);

            if (isMinimal) {
                const header = document.getElementById('callHeader');
                if (header) header.style.display = 'none';
            }

            if (isModerator) {
                myPeerId = `nutri_${cleanRoom}`;
                targetPeerId = `pac_${cleanRoom}`;
                document.getElementById('localNameText').textContent = 'Dra. Silvia';
                document.getElementById('remoteNameText').textContent = 'Paciente';
                document.getElementById('waitingTitle').textContent = 'Aguardando o Paciente...';
                document.getElementById('waitingDesc').textContent = 'Assim que o paciente acessar o portal, a teleconsulta iniciará imediatamente.';
                const btnScreen = document.getElementById('btnScreen');
                if (btnScreen) btnScreen.style.display = 'flex';
            } else {
                myPeerId = `pac_${cleanRoom}`;
                targetPeerId = `nutri_${cleanRoom}`;
                document.getElementById('localNameText').textContent = 'Você';
                document.getElementById('remoteNameText').textContent = 'Dra. Silvia Oliveira Lemos';
                document.getElementById('waitingTitle').textContent = 'Aguardando a Nutricionista...';
                document.getElementById('waitingDesc').textContent = 'Dra. Silvia já está conectando seu prontuário para iniciar o atendimento.';
            }

            setStatus('Iniciando câmera...');
            const streamOk = await initLocalStream();
            if (!streamOk) return;

            setStatus('Conectando à sala...');

            const fallbackIceServers = [
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.l.google.com:19302' }
            ];
            const serverIceServers = Array.isArray(authorized.iceServers)
                ? authorized.iceServers.filter(server => {
                    const urls = Array.isArray(server?.urls) ? server.urls : [server?.urls];
                    return urls.length > 0 && urls.every(url => typeof url === 'string' && /^(stun|turn|turns):/i.test(url));
                })
                : [];
            const rtcConfig = {
                iceServers: serverIceServers.length ? serverIceServers : fallbackIceServers,
                iceCandidatePoolSize: 10,
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require',
                sdpSemantics: 'unified-plan'
            };

            const peerOptions = { config: rtcConfig, debug: 0 };
            if (authorized.signaling?.mode === 'configured' && typeof authorized.signaling.host === 'string') {
                peerOptions.host = authorized.signaling.host;
                peerOptions.port = Number(authorized.signaling.port) || (authorized.signaling.secure === false ? 80 : 443);
                peerOptions.path = typeof authorized.signaling.path === 'string' ? authorized.signaling.path : '/';
                peerOptions.secure = authorized.signaling.secure !== false;
            }

            function initPeer(peerId) {
                try {
                    peer = new Peer(peerId, peerOptions);

                    peer.on('open', (id) => {
                        console.log('PeerJS Conectado com sucesso. ID:', id);
                        setStatus('Sala conectada. Pronto.');

                        if (isModerator) scheduleConnectionAttempt();
                    });

                    peer.on('call', (incomingCall) => {
                        console.log('Recebendo chamada WebRTC de:', incomingCall.peer);
                        incomingCall.answer(localStream);

                        incomingCall.on('stream', (remoteStreamObj) => {
                            handleCallConnected(incomingCall, remoteStreamObj);
                        });

                        incomingCall.on('close', () => {
                            handleCallDisconnected();
                        });
                    });

                    peer.on('error', (err) => {
                        if (err.type === 'peer-unavailable') {
                            setStatus('Aguardando o paciente entrar...');
                        } else if (err.type === 'unavailable-id') {
                            setStatus('Esta sessão já está aberta em outra aba.');
                            showToast('Feche a outra aba da teleconsulta e tente novamente.', 8000);
                        }
                    });

                } catch (err) {
                    console.error('Falha ao inicializar WebRTC:', err);
                    setStatus('Erro ao conectar');
                }
            }

            initPeer(myPeerId);
        };

        window.addEventListener('beforeunload', () => {
            stopTimer();
            if (connectRetryTimer) clearTimeout(connectRetryTimer);
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (peer) try { peer.destroy(); } catch (_) {}
            if (localStream) localStream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
