name: Database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate database secret
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ] && [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure MIGRATION_DATABASE_URL (preferencial) ou DATABASE_URL no environment production."
            exit 1
          fi
      - run: npm ci --include=dev
      - name: Check current schema
        continue-on-error: true
        run: npm --workspace backend-node run db:status
      - name: Apply pending migrations
        run: npm --workspace backend-node run db:migrate
      - name: Verify schema
        run: npm --workspace backend-node run db:status
    env:
      NODE_ENV: production
      # loadEnv exige DATABASE_URL. A conexão direta continua preferencial para DDL,
      # mas qualquer um dos dois secrets torna o workflow executável de forma coerente.
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      FRONTEND_ORIGIN: https://silviaoliveira.vercel.app
      APP_URL: https://silviaoliveira.vercel.app
      SMTP_FROM: migration@localhost.invalid
