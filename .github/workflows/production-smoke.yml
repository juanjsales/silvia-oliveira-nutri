name: Production smoke test
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL completa do deploy a homologar
        required: true
        default: https://silvia-oliveira-nutri-v2.vercel.app
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ADMIN_IDENTIFIER: ${{ secrets.SMOKE_ADMIN_IDENTIFIER }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
