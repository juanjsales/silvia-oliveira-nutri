name: Production smoke test
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL completa do deploy a homologar
        required: true
        default: https://silviaoliveira.vercel.app
permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production inputs
        run: node scripts/release-preflight.mjs
        env:
          RELEASE_REQUIRE_ENV: "true"
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ADMIN_IDENTIFIER: ${{ secrets.SMOKE_ADMIN_IDENTIFIER }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      - run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ADMIN_IDENTIFIER: ${{ secrets.SMOKE_ADMIN_IDENTIFIER }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          STRICT_SMOKE_AUTH: "true"
          SMOKE_TIMEOUT_MS: "15000"
          SMOKE_ALLOWED_HOSTS: "silviaoliveira.vercel.app"
