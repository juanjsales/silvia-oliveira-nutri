<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleconsulta · Dra. Silvia Oliveira Lemos</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src='https://meet.element.io/external_api.js'></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0e1a12;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #eef4e5;
            display: flex;
            flex-direction: column;
        }
        .call-header {
            background: #182a1f;
            border-bottom: 1px solid rgba(140,164,129,0.25);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 54px;
            flex-shrink: 0;
            z-index: 100;
        }
        .call-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .call-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }
        .call-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(52,211,153,0.15);
            border: 1px solid rgba(52,211,153,0.3);
            color: #34d399;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .call-timer {
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 800;
            color: #8ca481;
            background: rgba(140,164,129,0.15);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(140,164,129,0.25);
        }
        .btn-hangup {
            background: #f87171;
            color: #1a0808;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-hangup:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        #jitsi-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 54px);
            background: #0a120c;
        }
        .empty-call {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            text-align: center;
            padding: 24px;
            color: #a0b399;
        }
    </style>
</head>
<body>
    <header class="call-header">
        <div class="call-brand">
            <span style="font-size:1.2rem">🌿</span>
            <div>
                <div class="call-title" id="callHeaderTitle">Teleconsulta Nutricional</div>
                <div style="font-size:0.7rem; color:#a0b399" id="callHeaderSub">Dra. Silvia Oliveira Lemos</div>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:14px">
            <span class="call-status" id="callStatus">🔴 Conectando...</span>
            <div class="call-timer" id="callTimer">⏱️ 00:00</div>
            <button class="btn-hangup" onclick="encerrarChamada()">❌ Encerrar</button>
        </div>
    </header>

    <div id="jitsi-container"></div>

    <script>
        let api = null;
        let timerInterval = null;
        let secondsElapsed = 0;

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('callTimer').textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function encerrarChamada() {
            if (api) {
                try { api.executeCommand('hangup'); } catch(e){}
            }
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'JITSI_LEFT' }, '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const roomName = params.get('room');
            const userName = params.get('name') || params.get('user') || 'Convidado';
            const isMinimal = params.get('minimal') === 'true';

            if (isMinimal) {
                const hdr = document.querySelector('.call-header');
                if (hdr) hdr.style.display = 'none';
                const container = document.getElementById('jitsi-container');
                if (container) container.style.height = '100%';
            } else if (userName && userName !== 'Convidado') {
                document.getElementById('callHeaderSub').textContent = `Participante: ${userName}`;
            }

            if (roomName) {
                const domain = params.get('domain') || 'meet.element.io';

                if (typeof JitsiMeetExternalAPI === 'undefined') {
                    await new Promise((resolve) => {
                        const script = document.createElement('script');
                        script.src = `https://${domain}/external_api.js`;
                        script.onload = resolve;
                        script.onerror = resolve;
                        document.head.appendChild(script);
                    });
                }
                const roleParam = params.get('role');
                const isModerator = roleParam === 'moderator' || (userName && userName.toLowerCase().includes('silvia'));

                const options = {
                    roomName: roomName,
                    width: '100%',
                    height: '100%',
                    parentNode: document.querySelector('#jitsi-container'),
                    userInfo: {
                        displayName: userName,
                        role: isModerator ? 'moderator' : 'participant'
                    },
                    configOverwrite: {
                        prejoinPageEnabled: false,
                        prejoinConfig: {
                            enabled: false
                        },
                        startWithVideoMuted: false,
                        startWithAudioMuted: false,
                        disableDeepLinking: true,
                        requireDisplayName: false,
                        disableRemoteMute: !isModerator,
                        remoteVideoMenu: {
                            disableKick: !isModerator,
                            disableGrantModerator: !isModerator,
                            disablePrivateChat: false
                        }
                    },
                    interfaceConfigOverwrite: {
                        SHOW_JITSI_WATERMARK: false,
                        SHOW_WATERMARK_FOR_GUESTS: false,
                        TOOLBAR_BUTTONS: isModerator ? [
                            'microphone', 'camera', 'desktop', 'fullscreen',
                            'fodeviceselection', 'hangup', 'chat', 'recording',
                            'livestreaming', 'settings', 'raisehand', 'videoquality',
                            'filmstrip', 'invite', 'tileview', 'select-background',
                            'mute-everyone', 'mute-video-everyone', 'security'
                        ] : [
                            'microphone', 'camera', 'fullscreen', 'hangup', 'chat', 'raisehand', 'tileview'
                        ]
                    }
                };

                api = new JitsiMeetExternalAPI(domain, options);
                
                api.addEventListener('videoConferenceJoined', () => {
                    const statusEl = document.getElementById('callStatus');
                    if (statusEl) statusEl.textContent = '🟢 Em Chamada';
                    startTimer();
                });

                api.addEventListener('participantJoined', (participant) => {
                    console.log('Participante entrou:', participant);
                });

                api.addEventListener('videoConferenceLeft', () => {
                    const statusEl = document.getElementById('callStatus');
                    if (statusEl) statusEl.textContent = '🔴 Chamada Encerrada';
                    stopTimer();
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'JITSI_LEFT' }, '*');
                    }
                });

            } else {
                document.getElementById('jitsi-container').innerHTML = `
                    <div class="empty-call">
                        <div style="font-size:3rem">📹</div>
                        <h2 style="color:#ffffff; font-family:'Playfair Display',serif">Sala não especificada</h2>
                        <p>Por favor, utilize um link válido para acessar a teleconsulta.</p>
                        <button class="btn-hangup" style="background:#8ca481; color:#0a120c; margin-top:12px" onclick="window.close()">Fechar</button>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
